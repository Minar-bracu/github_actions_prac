[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "github-actions-prac"
version = "0.1.0"
description = "A simple greeting app."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pylint>=3,<5",
    "pytest>=8,<10",
    "build>=1,<3",
]

[tool.setuptools]
py-modules = ["main"]
