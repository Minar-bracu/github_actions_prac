name: Hello Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
    lint:
        name: Pylint check
        runs-on: ubuntu-latest
        steps:
            - name: Get source code
              uses: actions/checkout@v4 
            - name: Set up Python
                uses: actions/setup-python@v5
                with:
                    python-version: '3.12'
            - name: Install Pylint
              run: python -m pip install pylint
            - name: Run Pylint
              run: pylint **/*.py
              
            


