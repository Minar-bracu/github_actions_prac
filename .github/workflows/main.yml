name: Hello Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      python-version:
        description: Python version to use
        required: true
        default: '3.12'

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml
    with:
      python-version: ${{ inputs.python-version || '3.12' }}

  test:
    name: Test
    uses: ./.github/workflows/test.yml
    with:
      python-version: ${{ inputs.python-version || '3.12' }}

  build:
    name: Build package
    needs: [lint, test]
    uses: ./.github/workflows/build.yml
    with:
      python-version: ${{ inputs.python-version || '3.12' }}

  publish:
    name: Publish package
    needs: build
    uses: ./.github/workflows/publish.yml
